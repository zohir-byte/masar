plugins {
    id 'com.android.application'
}

android {
    namespace 'de.zohir.masar'
    compileSdk 34

    defaultConfig {
        applicationId 'de.zohir.masar'
        minSdk 26
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName = '1.' + (System.getenv('BUILD_NUMBER') ?: '0')
    }

    signingConfigs {
        masar {
            // keystore is created by the build workflow; never stored in the repo
            storeFile file(System.getenv('KS_FILE') ?: 'none.keystore')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'masar'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.masar
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
